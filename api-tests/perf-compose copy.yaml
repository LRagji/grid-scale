services:
  k6-single:
    image: grafana/k6:latest
    container_name: k6-seq-single
    volumes:
      - ../dist/api-tests/seq-single-write-range-read-tests.js:/scripts/seq-single-write-range-read-tests.js:ro
    environment:
      TEST_URL: http://rest-wrapper:8080
      K6_VUS: "100"
      K6_ITERATIONS: "10000"
      K6_MAX_DURATION: 30m
      SLEEP_DURATION: "1"
      K6_OTEL_GRPC_EXPORTER_INSECURE: "true"
      K6_OTEL_METRIC_PREFIX: "k6_"
      K6_OTEL_GRPC_EXPORTER_ENDPOINT: "otel:4317"
    command:
      - run
      - --out
      - opentelemetry
      - /scripts/seq-single-write-range-read-tests.js
  k6-bulk-time:
    image: grafana/k6:latest
    container_name: k6-seq-bulk-time
    volumes:
      - ../dist/api-tests/seq-bulk-time-write-range-read-tests.js:/scripts/seq-bulk-time-write-range-read-tests.js:ro
    environment:
      TEST_URL: http://rest-wrapper:8080
      K6_VUS: "100"
      K6_ITERATIONS: "10000"
      K6_MAX_DURATION: 30m
      SLEEP_DURATION: "1"
      BULK: "100"
      K6_OTEL_GRPC_EXPORTER_INSECURE: "true"
      K6_OTEL_METRIC_PREFIX: "k6_"
      K6_OTEL_GRPC_EXPORTER_ENDPOINT: "otel:4317"
    command:
      - run
      - --out
      - opentelemetry
      - /scripts/seq-bulk-time-write-range-read-tests.js
  k6-bulk-tag:
    image: grafana/k6:latest
    container_name: k6-seq-bulk-tag
    volumes:
      - ../dist/api-tests/seq-bulk-tag-write-range-read-tests.js:/scripts/seq-bulk-tag-write-range-read-tests.js:ro
    environment:
      TEST_URL: http://rest-wrapper:8080
      K6_VUS: "100"
      K6_ITERATIONS: "10000"
      K6_MAX_DURATION: 30m
      SLEEP_DURATION: "1"
      BULK: "100"
      K6_OTEL_GRPC_EXPORTER_INSECURE: "true"
      K6_OTEL_METRIC_PREFIX: "k6_"
      K6_OTEL_GRPC_EXPORTER_ENDPOINT: "otel:4317"
    command:
      - run
      - --out
      - opentelemetry
      - /scripts/seq-bulk-tag-write-range-read-tests.js
networks:
  default:
    name: grid-store-network
